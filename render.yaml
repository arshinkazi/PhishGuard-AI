services:
  - type: web
    name: phishguard-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python models/train_model.py"
    startCommand: "gunicorn backend.app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
